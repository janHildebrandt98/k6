<!doctype html>
<html>
<body>
<!--  <input id="elem"></input>-->
<script>
	let attached = false;
	let elem;

	function loop() {
		if (attached) {
			elem.remove();
		} else {
			elem = document.createElement("input")
			elem.setAttribute("id", "elem")
			document.body.appendChild(elem)
		}
		attached = !attached;
		setTimeout(loop, 0);
	}

	setTimeout(loop, 0);
</script>
</body>
</html>
